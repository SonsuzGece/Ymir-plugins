name: Deploy Nuvio Plugin to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip files
        run: |
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "Extracting: $zipfile"
              unzip -o "$zipfile" -d _extracted/
            fi
          done

          mkdir -p _site/providers

          find _extracted -name "manifest.json" -exec cp {} _site/manifest.json \; 2>/dev/null || true
          find _extracted -name "domains.json" -exec cp {} _site/domains.json \; 2>/dev/null || true
          find _extracted -name "*.js" -path "*/providers/*" -exec cp {} _site/providers/ \; 2>/dev/null || true
          find _extracted -name "icon.png" -exec cp {} _site/ \; 2>/dev/null || true

          echo "Deployed files:"
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
